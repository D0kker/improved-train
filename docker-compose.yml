name: lol-network-analyzer

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__RecentMatchIdsTtlSeconds: ${CACHE_RECENT_MATCH_IDS_TTL_SECONDS:-120}
      Cache__MatchDetailsTtlSeconds: ${CACHE_MATCH_DETAILS_TTL_SECONDS:-3600}
      Cache__PlayerIdentityTtlSeconds: ${CACHE_PLAYER_IDENTITY_TTL_SECONDS:-1800}
      Cache__AnalysisResultTtlSeconds: ${CACHE_ANALYSIS_RESULT_TTL_SECONDS:-900}
      Cache__MaxMemoryEntries: ${CACHE_MAX_MEMORY_ENTRIES:-4096}
      Cache__MaxMemoryBytes: ${CACHE_MAX_MEMORY_BYTES:-67108864}
      OnDemandAnalysis__RequestTimeoutSeconds: ${ANALYSIS_REQUEST_TIMEOUT_SECONDS:-180}
      OnDemandAnalysis__RequestConcurrency: ${ANALYSIS_REQUEST_CONCURRENCY:-3}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PLATFORM_REGION: ${RIOT_PLATFORM_REGION:-la1}
      RIOT_REGIONAL_ROUTING: ${RIOT_REGIONAL_ROUTING:-americas}
      RIOT_REQUEST_TIMEOUT_SECONDS: ${RIOT_REQUEST_TIMEOUT_SECONDS:-10}
      RIOT_REQUEST_CONCURRENCY: ${RIOT_REQUEST_CONCURRENCY:-3}
      RIOT_MAX_RETRY_ATTEMPTS: ${RIOT_MAX_RETRY_ATTEMPTS:-2}
      RIOT_BASE_RETRY_DELAY_MILLISECONDS: ${RIOT_BASE_RETRY_DELAY_MILLISECONDS:-250}
      RIOT_MAX_RETRY_DELAY_SECONDS: ${RIOT_MAX_RETRY_DELAY_SECONDS:-120}
      API_CONCURRENCY_LIMIT: ${API_CONCURRENCY_LIMIT:-8}
      API_QUEUE_LIMIT: ${API_QUEUE_LIMIT:-16}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      DATA_DRAGON_VERSION: ${DATA_DRAGON_VERSION:-16.17.1}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${WEB_PORT:-38080}:3000"
    restart: unless-stopped
