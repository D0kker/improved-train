name: lol-network-analyzer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lol_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-lol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      # PostgreSQL 18+ stores versioned clusters below this mount point.
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lol_analyzer};Username=${POSTGRES_USER:-lol};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      Redis__Host: redis
      Redis__Port: 6379
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PLATFORM_REGION: ${RIOT_PLATFORM_REGION:-la1}
      RIOT_REGIONAL_ROUTING: ${RIOT_REGIONAL_ROUTING:-americas}
      RIOT_REQUEST_TIMEOUT_SECONDS: ${RIOT_REQUEST_TIMEOUT_SECONDS:-10}
      RIOT_REQUEST_CONCURRENCY: ${RIOT_REQUEST_CONCURRENCY:-3}
      RIOT_MAX_RETRY_ATTEMPTS: ${RIOT_MAX_RETRY_ATTEMPTS:-2}
      RIOT_BASE_RETRY_DELAY_MILLISECONDS: ${RIOT_BASE_RETRY_DELAY_MILLISECONDS:-250}
      RIOT_MAX_RETRY_DELAY_SECONDS: ${RIOT_MAX_RETRY_DELAY_SECONDS:-120}
      CACHE_PLAYER_SUMMARY_TTL_SECONDS: ${CACHE_PLAYER_SUMMARY_TTL_SECONDS:-300}
      API_CONCURRENCY_LIMIT: ${API_CONCURRENCY_LIMIT:-32}
      API_QUEUE_LIMIT: ${API_QUEUE_LIMIT:-32}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lol_analyzer};Username=${POSTGRES_USER:-lol};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      Redis__Host: redis
      Redis__Port: 6379
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PLATFORM_REGION: ${RIOT_PLATFORM_REGION:-la1}
      RIOT_REGIONAL_ROUTING: ${RIOT_REGIONAL_ROUTING:-americas}
      RIOT_REQUEST_TIMEOUT_SECONDS: ${RIOT_REQUEST_TIMEOUT_SECONDS:-10}
      RIOT_REQUEST_CONCURRENCY: ${RIOT_REQUEST_CONCURRENCY:-3}
      RIOT_MAX_RETRY_ATTEMPTS: ${RIOT_MAX_RETRY_ATTEMPTS:-2}
      RIOT_BASE_RETRY_DELAY_MILLISECONDS: ${RIOT_BASE_RETRY_DELAY_MILLISECONDS:-250}
      RIOT_MAX_RETRY_DELAY_SECONDS: ${RIOT_MAX_RETRY_DELAY_SECONDS:-120}
      CACHE_PLAYER_SUMMARY_TTL_SECONDS: ${CACHE_PLAYER_SUMMARY_TTL_SECONDS:-300}
      AnalysisJobs__BatchSize: ${ANALYSIS_JOB_BATCH_SIZE:-20}
      AnalysisJobs__PollInterval: ${ANALYSIS_JOB_POLL_INTERVAL:-00:00:02}
      AnalysisJobs__LeaseTimeout: ${ANALYSIS_JOB_LEASE_TIMEOUT:-00:15:00}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      DATA_DRAGON_VERSION: ${DATA_DRAGON_VERSION:-16.17.1}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${WEB_PORT:-38080}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
