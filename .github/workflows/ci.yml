name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run type-check
      - run: npm run build

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LolAnalyzer.slnx
      - run: dotnet build LolAnalyzer.slnx --configuration Release --no-restore
      - run: dotnet test LolAnalyzer.slnx --configuration Release --no-build
      - run: dotnet format LolAnalyzer.slnx --verify-no-changes --no-restore

  containers:
    runs-on: ubuntu-latest
    needs: [web, dotnet]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
